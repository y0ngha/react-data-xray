name: PR body

# 본문을 고칠 때마다 다시 확인해야 해서 CI 와 나눈다. 같은 워크플로에 두면 본문만 고친 실행에서
# check 가 건너뜀(성공으로 친다)으로 남아 앞선 실패를 덮는다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-body:
    name: pr-body
    runs-on: ubuntu-latest
    steps:
      - name: PR 템플릿을 쓰고, 템플릿으로 만든 열린 이슈를 닫는지 확인
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          grep -q '<!-- rdx-pr-template -->' <<<"$BODY" \
            || fail "PR 본문은 .github/pull_request_template.md 템플릿으로 써 주세요."

          # GitHub 은 HTML 주석과 코드 블록 안의 키워드로는 이슈를 닫지 않으므로 빼고 본다.
          VISIBLE=$(perl -0pe 's/<!--.*?-->//gs; s/```.*?```//gs' <<<"$BODY")
          REPO_RE=${REPO//./\\.}
          # 이 저장소의 이슈를 닫는 형식: Closes #12, Closes: #12, Fixes owner/repo#12, Resolves https://github.com/owner/repo/issues/12
          NUMBERS=$(grep -Eio "\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +(${REPO_RE}#|#|https://github\.com/${REPO_RE}/issues/)[0-9]+" <<<"$VISIBLE" \
            | grep -Eo '[0-9]+$' | sort -u)
          [ -n "$NUMBERS" ] || fail "PR 이 닫을 이슈를 'Closes #번호' 로 적어 주세요. 이슈가 없으면 템플릿으로 먼저 만듭니다."

          for n in $NUMBERS; do
            info=$(gh api "repos/$REPO/issues/$n" \
              --jq '[.state, (.pull_request != null), ((.body // "") | contains("<!-- rdx-issue-template -->"))] | @tsv') \
              || fail "#$n 이슈를 찾지 못했습니다."
            IFS=$'\t' read -r state is_pr has_template <<<"$info"
            [ "$is_pr" = "false" ] || fail "#$n 은 이슈가 아니라 PR 입니다."
            [ "$state" = "open" ] || fail "#$n 이슈가 이미 닫혀 있습니다."
            [ "$has_template" = "true" ] || fail "#$n 이슈가 이슈 템플릿으로 만들어지지 않았습니다. 템플릿 본문으로 고쳐 주세요."
          done
